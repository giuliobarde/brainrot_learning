services:
  mongo:
    image: mongo:7
    container_name: brainrot-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-brainrot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-brainrot-dev}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-brainrot}
    volumes:
      - brainrot_mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    container_name: brainrot-mongo-express
    restart: unless-stopped
    profiles: ['tools']
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-brainrot}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-brainrot-dev}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-brainrot}:${MONGO_ROOT_PASSWORD:-brainrot-dev}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  brainrot_mongo_data:
